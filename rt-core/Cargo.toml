[package]
name = "rt-core"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"  # 添加 serde_yaml 依赖，用于 YAML 配置文件解析
schemars = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }
regex = "1.12.2"
confy = "2.0.0"
moka = { version = "0.12.11", features = ["future"] }
sled = "0.34.7"
bincode = { version = "2.0.1", features = ["serde"] }
tempfile = "3.23.0"
zstd = "0.13.3"
async-compression = { version = "0.4.36", features = ["tokio", "zstd"] }
wasmtime = "14.0.0"
sha2 = "0.10.9"
hex = "0.4.3"
wasmtime-wasi = "14.0.0"
wasi-common = "14.0.0"
num_cpus = "1.16.0"
rustc_version = "0.4.0"
warp = "0.3.7"
tokio = { workspace = true, features = ["process", "io-util", "fs", "sync", "time", "net"] }
futures-util = "0.3.31"
