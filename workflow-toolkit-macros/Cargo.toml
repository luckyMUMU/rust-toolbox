[package]
name = "workflow-toolkit-macros"
version = "0.1.0"
edition = "2021"
authors = ["Atlas Orchestrator"]
description = "Proc-macros for workflow-toolkit"
license = "MIT OR Apache-2.0"
repository = "https://github.com/.../workflow-toolkit"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "derive"] }

[dev-dependencies]
workflow-toolkit = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
