[package]
name = "rt-plugin-ytdlp"
version = "0.1.0"
edition = "2021"
authors = ["Rust Toolbox Team"]
description = "YouTube-DL Integration Plugin for Rust Toolbox"

[dependencies]
rt-core = { path = "../rt-core" }
rt-tools = { path = "../rt-tools" }
clap = { version = "4.4", features = ["derive"] }
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
log = "0.4"
log4rs = "1.2"
