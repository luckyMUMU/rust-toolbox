[package]
name = "file-management-plugin"
version = "0.1.0"
edition = "2021"
authors = ["Workflow Toolkit Team"]
description = "File management plugin for workflow-toolkit"
license = "MIT"

[dependencies]
# 核心依赖（来自主 crate）
workflow-toolkit = { path = ".." }

# 异步运行时
tokio = { version = "1.42", features = ["full"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 错误处理
thiserror = "2.0"
anyhow = "1.0"

# 日志
tracing = "0.1"

# 正则表达式
regex = "1.10"

# 文件操作
tempfile = "3.14"
walkdir = "2.5"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

# 并发
dashmap = "6.1"

# 中文处理
pinyin = "0.10"

# 压缩
flate2 = "1.0"
tar = "0.4"

[dev-dependencies]
tokio-test = "0.4"
