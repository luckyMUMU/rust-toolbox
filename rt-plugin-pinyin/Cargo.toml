[package]
name = "rt-plugin-pinyin"
version = "0.1.0"
edition = "2021"

[dependencies]
rt-core = { path = "../rt-core" }
rt-tools = { path = "../rt-tools" }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
pinyin = "0.9"
anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
