[package]
name = "rt-plugin-czkawka"
version = "0.1.0"
edition = "2024"

[dependencies]
rt-core = { path = "../rt-core" }
rt-tools = { path = "../rt-tools" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["derive"] }
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.32", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"

# Czkawka dependencies
czkawka_core = { version = "^10.0.0", default-features = false }
