# Default configuration for Workflow Toolkit

[server]
http_port = 8080
ws_port = 8081
bind_address = "127.0.0.1"
cors_origins = ["*"]
max_connections = 1000
request_timeout = "30s"

[storage]
database_path = "./data/workflow.db"
cache_size = 104857600  # 100MB
cache_ttl = "1h"
backup_enabled = true
backup_interval = "24h"
retention_days = 30

[logging]
level = "info"
format = "Pretty"
output = "Stdout"
file_path = "./logs/workflow-toolkit.log"
max_file_size = 10485760  # 10MB
max_files = 5

[plugins]
plugin_dir = "./plugins"
auto_load = true
sandbox_enabled = true
timeout = "5m"
memory_limit = 536870912  # 512MB

[auth]
enabled = false
token_expiry = "1h"
allowed_origins = ["*"]

[rate_limit]
requests_per_minute = 60
burst_size = 10
enabled = true

[workflow]
max_concurrent_workflows = 10
default_timeout = "1h"
checkpoint_enabled = true
checkpoint_interval = "5m"
cleanup_interval = "24h"