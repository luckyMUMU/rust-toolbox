# 交互式文件夹分类工作流 (Interactive Folder Classification Workflow)
# 严格按照13步流程执行，支持人工决策介入以及实验模式
# 对应 Python 实现: folder_classifier_v5_improved2.py

name: "interactive-folder-classification-v5"
version: "2.0.0"
description: "Interactive folder classification with granular 13-step process"

metadata:
  author: "File Management Tools"
  category: "file-management"
  created: "2024-05-20"
  tags: ["classification", "interactive", "granular", "v5"]

# 工作流可自定义参数
parameters:
  source_directory:
    type: "string"
    description: "Directory containing folders to classify"
    required: true
  
  classification_rules:
    type: "object"
    description: "Classification rules configuration or file path"
    required: true
  
  experimental_mode:
    type: "boolean"
    description: "Run in experimental mode (simulate operations)"
    default: true
  
  enable_user_interaction:
    type: "boolean"
    description: "Enable human decision-making"
    default: true
  
  confidence_threshold:
    type: "number"
    description: "Minimum confidence score"
    default: 0.8

# 13个明确步骤的执行节点
nodes:

  # 1. 规则读取与验证
  - id: "step1_load_rules"
    node_type: "Tool"
    tool_name: "rule-loader"
    parameters:
      rules: "${classification_rules}"
    metadata:
      description: "读取并验证分类规则"

  # 2. 规则预处理 (英文转小写, 中文生成拼音/变体)
  - id: "step2_preprocess_rules"
    node_type: "Tool"
    tool_name: "rule-preprocessor"
    parameters:
      rules: "${step1_load_rules}"
    metadata:
      description: "预处理规则关键词"

  # 3. AC自动机构建 (构建高效数据结构)
  - id: "step3_build_automaton"
    node_type: "Tool"
    tool_name: "ac-automaton-builder"
    parameters:
      patterns: "${step2_preprocess_rules.patterns}"
    metadata:
      description: "构建AC自动机配置"

  # 4. 源目录扫描
  - id: "step4_scan_directory"
    node_type: "Tool"
    tool_name: "directory-scanner"
    parameters:
      directory: "${source_directory}"
    metadata:
      description: "扫描源目录子文件夹"

  # 5. 文件夹名称预处理
  - id: "step5_preprocess_folders"
    node_type: "Tool"
    tool_name: "folder-name-preprocessor"
    parameters:
      folders: "${step4_scan_directory.folders}"
    metadata:
      description: "预处理文件夹名称"

  # 6. 并行匹配执行
  - id: "step6_parallel_match"
    node_type: "Tool"
    tool_name: "parallel-matcher"
    parameters:
      automaton_config: "${step3_build_automaton}"
      folders: "${step5_preprocess_folders.processed_folders}"
    metadata:
      description: "执行并行AC匹配"

  # 7. 评分计算
  - id: "step7_calculate_scores"
    node_type: "Tool"
    tool_name: "score-calculator"
    parameters:
      match_results: "${step6_parallel_match.match_results}"
    metadata:
      description: "计算匹配得分"

  # 8. 多规则处理 (歧义检测)
  - id: "step8_detect_ambiguity"
    node_type: "Tool"
    tool_name: "ambiguity-detector"
    parameters:
      scored_results: "${step7_calculate_scores.scored_results}"
      confidence_threshold: "${confidence_threshold}"
    metadata:
      description: "检测多规则匹配和歧义"

  # 9. 结果合并 (整合自动和待人工处理项)
  # 注意：在进入人工环节前，这里主要整理出需要人工介入的列表
  # 如果不启用人工交互，则直接视为最终结果
  - id: "step9_merge_results"
    node_type: "Tool"
    tool_name: "result-merger"
    parameters:
      classified: "${step8_detect_ambiguity.classified}"
      # 此阶段尚未有人工输入，仅传递自动结果，或标记待处理
      manual_results: [] 
    metadata:
      description: "初步合并结果"

  # 10. 实验模式检查
  - id: "step10_check_experimental"
    node_type: "Tool"
    tool_name: "experimental-check"
    parameters:
      experimental_mode: "${experimental_mode}"
    metadata:
      description: "检查实验模式状态"

  # 11. 人工确认 (如果启用且有歧义或未分类项)
  - id: "step11_human_confirmation"
    node_type: "Tool"
    tool_name: "human-decision"
    # 仅当启用交互且存在歧义项时执行，或者在实验模式下总是确认
    # 这里为了演示流程，我们总是调用，工具内部可根据参数决定是否跳过
    parameters:
      decision_type: "Classification"
      context:
        title: "分类确认"
        description: "请确认分类结果，特别是歧义项"
        metadata:
          info: "Please review the ambiguous items below"
      # 将歧义项传递给用户
      items: "${step8_detect_ambiguity.ambiguous}"
      timeout_seconds: 300
    metadata:
      description: "人工确认分类结果"

  # 9b. 二次结果合并 (合并人工确认后的结果)
  # 这是一个逻辑上的“结果合并”步骤的补充，用于整合Step 11的输出
  - id: "step9b_final_merge"
    node_type: "Tool"
    tool_name: "result-merger"
    parameters:
      classified: "${step8_detect_ambiguity.classified}"
      manual_results: "${step11_human_confirmation.decisions}"
    metadata:
      description: "整合最终操作列表"

  # 12. 文件夹移动
  - id: "step12_move_folders"
    node_type: "Tool"
    tool_name: "file-mover"
    parameters:
      operations: "${step9b_final_merge.merge_operations}"
      conflict_resolution: "Rename"
      create_directories: true
      # 关键：实验模式由 step10 的结果或全局参数控制
      experimental_mode: "${step10_check_experimental.is_experimental}"
    metadata:
      description: "执行文件夹移动操作"

  # 13. 报告生成
  - id: "step13_generate_report"
    node_type: "Tool"
    tool_name: "report-generator"
    parameters:
      operations: "${step12_move_folders.errors}" # 实际应包含所有结果
      # 为了完整报告，这里应该传入更多上下文，目前仅传入移动结果
    metadata:
      description: "生成操作报告"

# 节点连接关系 (线性流)
edges:
  - from: "step1_load_rules"
    to: "step2_preprocess_rules"
  - from: "step2_preprocess_rules"
    to: "step3_build_automaton"
  - from: "step3_build_automaton"
    to: "step4_scan_directory"
  - from: "step4_scan_directory"
    to: "step5_preprocess_folders"
  - from: "step5_preprocess_folders"
    to: "step6_parallel_match"
  - from: "step6_parallel_match"
    to: "step7_calculate_scores"
  - from: "step7_calculate_scores"
    to: "step8_detect_ambiguity"
  - from: "step8_detect_ambiguity"
    to: "step9_merge_results"
  - from: "step9_merge_results"
    to: "step10_check_experimental"
  - from: "step10_check_experimental"
    to: "step11_human_confirmation"
  - from: "step11_human_confirmation"
    to: "step9b_final_merge"
  - from: "step9b_final_merge"
    to: "step12_move_folders"
  - from: "step12_move_folders"
    to: "step13_generate_report"

global_config:
  default_timeout: 3600
