name: simple-workflow
version: "1.0.0"
description: A simple example workflow for testing
metadata: {}

global_config:
  timeout: 300
  checkpoint_interval: 60

nodes:
  - id: "step1"
    node_type: "Tool"
    tool_name: "echo"
    parameters:
      message: "Hello from step 1"
    retry_policy: null
    timeout: null
    metadata: {}
    depends_on: []
    
  - id: "step2"
    node_type: "Tool"
    tool_name: "echo"
    parameters:
      message: "Hello from step 2"
    retry_policy: null
    timeout: null
    metadata: {}
    depends_on: []

edges:
  - from: "step1"
    to: "step2"
    condition: null