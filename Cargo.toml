[workspace]
resolver = "2"
members = [
    "rt-core",
    "rt-tools",
    "rt-cli",
    "rt-gui",
    "rt-plugin-pinyin",
]

[workspace.dependencies]
# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"

# Async Runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = "0.3"
log = "0.4"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Internal Crates
rt-core = { path = "rt-core" }
rt-tools = { path = "rt-tools" }
