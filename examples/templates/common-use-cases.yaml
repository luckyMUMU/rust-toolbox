---
# Use Case 6: Document Management System
# Scenario: Organize business documents with compliance requirements
document_management_system:
  name: "Business Document Management"
  description: "Organize business documents with compliance and retention policies"
  
  source_directory: "${BUSINESS_DOCS_INPUT}"
  output_directory: "${BUSINESS_DOCS_OUTPUT}"
  classification_rules: |
    {
      "categories": {
        "contracts": {
          "keywords": [
            {"pattern": "contract", "weight": 1.0},
            {"pattern": "agreement", "weight": 0.9},
            {"pattern": "legal", "weight": 0.8}
          ],
          "target_directory": "Legal/Contracts/${YEAR}",
          "retention_years": 7,
          "confidentiality": "high"
        },
        "financial": {
          "keywords": [
            {"pattern": "invoice", "weight": 1.0},
            {"pattern": "receipt", "weight": 0.9},
            {"pattern": "financial", "weight": 0.8}
          ],
          "target_directory": "Financial/${YEAR}/${QUARTER}",
          "retention_years": 7,
          "confidentiality": "high"
        },
        "hr_documents": {
          "keywords": [
            {"pattern": "employee", "weight": 1.0},
            {"pattern": "hr", "weight": 0.9},
            {"pattern": "personnel", "weight": 0.8}
          ],
          "target_directory": "HR/${YEAR}",
          "retention_years": 5,
          "confidentiality": "very_high"
        }
      }
    }
  
  experimental_mode: false
  enable_user_interaction: true
  batch_size: 10
  decision_timeout: 600
  
  # Compliance settings
  audit_logging: true
  compliance_mode: true
  require_approval: true
  data_classification: true
  retention_enforcement: true

