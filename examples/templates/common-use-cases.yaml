  source_directory: "${HOME}/Projects/Completed"
  output_directory: "${HOME}/Projects/Archive"
  classification_rules: |
    {
      "categories": {
        "client_a": {
          "keywords": [
            {"pattern": "clienta", "weight": 1.0},
            {"pattern": "client_a", "weight": 1.0},
            {"pattern": "acme", "weight": 0.9}
          ],
          "target_directory": "ClientA/${YEAR}"
        },
        "client_b": {
          "keywords": [
            {"pattern": "clientb", "weight": 1.0},
            {"pattern": "client_b", "weight": 1.0},
            {"pattern": "beta", "weight": 0.9}
          ],
          "target_directory": "ClientB/${YEAR}"
        },
        "internal": {
          "keywords": [
            {"pattern": "internal", "weight": 1.0},
            {"pattern": "company", "weight": 0.8},
            {"pattern": "training", "weight": 0.7}
          ],
          "target_directory": "Internal/${YEAR}"
        }
      }
