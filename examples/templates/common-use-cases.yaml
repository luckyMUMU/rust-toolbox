# Common Use Cases for File Management Tools
# This file contains workflow configurations for typical file organization scenarios

# Use Case 1: Personal Desktop Cleanup
# Scenario: Organize a messy desktop with mixed file types
personal_desktop_cleanup:
  name: "Personal Desktop Organization"
  description: "Clean up and organize desktop files into appropriate folders"
  
  # Configuration
  source_directory: "${HOME}/Desktop"
  output_directory: "${HOME}/Desktop/Organized"
  classification_rules: "examples/templates/classification-rules-example.json"
  
  # Settings optimized for personal use
  experimental_mode: true
  enable_user_interaction: true
  batch_size: 10
  decision_timeout: 180
  create_backups: true
  
  # Human decision configuration
  human_decisions:
    ambiguous_threshold: 0.3
    confidence_threshold: 0.8
    enable_batch_decisions: true
    remember_preferences: true

---
# Use Case 2: Downloads Folder Organization
# Scenario: Automatically organize downloaded files by type and date
downloads_organization:
  name: "Downloads Folder Organization"
  description: "Organize downloaded files by type with date-based subfolders"
  
  source_directory: "${HOME}/Downloads"
  output_directory: "${HOME}/Downloads/Organized"
  classification_rules: |
    {
      "categories": {
        "documents": {
          "keywords": [
            {"pattern": "pdf", "weight": 1.0},
            {"pattern": "doc", "weight": 1.0},
            {"pattern": "txt", "weight": 0.8}
          ],
          "target_directory": "Documents/${YEAR}/${MONTH}"
        },
        "images": {
          "keywords": [
            {"pattern": "jpg", "weight": 1.0},
            {"pattern": "png", "weight": 1.0},
            {"pattern": "gif", "weight": 0.9}
          ],
          "target_directory": "Images/${YEAR}/${MONTH}"
        },
        "software": {
          "keywords": [
            {"pattern": "exe", "weight": 1.0},
            {"pattern": "msi", "weight": 1.0},
            {"pattern": "dmg", "weight": 1.0}
          ],
          "target_directory": "Software"
        }
      }
    }
  
  # Automated processing for downloads
  experimental_mode: false
  enable_user_interaction: false
  batch_size: 50
  conflict_resolution: "Rename"
  
  # Date-based organization
  use_date_folders: true
  date_format: "YYYY/MM"

---
# Use Case 3: Project Archive Organization
# Scenario: Organize old project folders by client and year
