  output_directory: "${BACKUP_OUTPUT_DIR}"
  classification_rules: |
    {
      "categories": {
        "database_backups": {
          "keywords": [
            {"pattern": "database", "weight": 1.0},
            {"pattern": "db", "weight": 0.9},
            {"pattern": "sql", "weight": 0.8},
            {"pattern": "backup", "weight": 0.7}
          ],
          "target_directory": "Database/${YEAR}/${MONTH}"
        },
        "system_backups": {
          "keywords": [
            {"pattern": "system", "weight": 1.0},
            {"pattern": "server", "weight": 0.9},
            {"pattern": "config", "weight": 0.8}
          ],
          "target_directory": "System/${YEAR}/${MONTH}"
        },
        "user_backups": {
          "keywords": [
            {"pattern": "user", "weight": 1.0},
            {"pattern": "home", "weight": 0.8},
            {"pattern": "personal", "weight": 0.7}
          ],
          "target_directory": "Users/${YEAR}/${MONTH}"
