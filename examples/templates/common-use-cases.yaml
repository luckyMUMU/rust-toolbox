# Use Case 10: Temporary File Cleanup
# Scenario: Clean up and organize temporary files and caches
temporary_file_cleanup:
  name: "Temporary File Cleanup"
  description: "Clean up temporary files and organize by application and age"
  
  source_directory: "${TEMP_DIR}"
  output_directory: "${TEMP_DIR}/Organized"
  classification_rules: |
    {
      "categories": {
        "browser_cache": {
          "keywords": [
            {"pattern": "cache", "weight": 1.0},
            {"pattern": "browser", "weight": 0.9},
            {"pattern": "chrome", "weight": 0.8},
            {"pattern": "firefox", "weight": 0.8}
          ],
          "target_directory": "BrowserCache",
          "auto_delete_days": 30
        },
        "application_temp": {
          "keywords": [
            {"pattern": "temp", "weight": 1.0},
            {"pattern": "tmp", "weight": 1.0},
            {"pattern": "temporary", "weight": 0.9}
          ],
          "target_directory": "ApplicationTemp",
          "auto_delete_days": 7
        },
        "log_files": {
          "keywords": [
            {"pattern": "log", "weight": 1.0},
            {"pattern": "debug", "weight": 0.8},
            {"pattern": "trace", "weight": 0.7}
          ],
          "target_directory": "Logs/${YEAR}/${MONTH}",
          "auto_delete_days": 90
        }
      }
    }
  
  experimental_mode: true
  enable_user_interaction: true
  batch_size: 100
  
  # Cleanup-specific settings
  check_file_age: true
  safe_delete_mode: true
  preserve_recent_files: true
  create_cleanup_report: true

# Usage Instructions:
# 
# 1. Copy the desired use case configuration to a new YAML file
# 2. Adjust paths and settings for your environment
# 3. Set required environment variables
# 4. Run the workflow:
#    cargo run -- workflow execute your-config.yaml
# 
# Environment Variables by Use Case:
# 
# Personal Desktop Cleanup:
# - HOME: User home directory
# 
# Downloads Organization:
# - HOME: User home directory
# - YEAR: Current year (auto-detected if not set)
# - MONTH: Current month (auto-detected if not set)
# 
# Project Archive:
# - HOME: User home directory
# - YEAR: Project completion year
# 
# Media Library:
# - HOME: User home directory
# - YEAR: Photo/video year (from EXIF if available)
# 
# Development Cleanup:
# - HOME: User home directory
# - STATUS: Project status (active, completed, archived)
# 
# Document Management:
# - BUSINESS_DOCS_INPUT: Input directory for business documents
# - BUSINESS_DOCS_OUTPUT: Output directory for organized documents
# - YEAR: Document year
# - QUARTER: Financial quarter (Q1, Q2, Q3, Q4)
# 
# Backup Organization:
# - BACKUP_INPUT_DIR: Backup files input directory
# - BACKUP_OUTPUT_DIR: Organized backup output directory
# - YEAR: Backup year
# - MONTH: Backup month
# 
# Research Papers:
# - HOME: User home directory
# - YEAR: Publication year
# 
# Email Attachments:
# - HOME: User home directory
# - YEAR: Email year
# - MONTH: Email month
# 
# Temporary Cleanup:
# - TEMP_DIR: Temporary files directory (usually /tmp or %TEMP%)
# - YEAR: Current year
# - MONTH: Current month